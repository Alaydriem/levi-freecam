name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/levi-freecam

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: levi-freecam
    steps:
      # the path dependencies name ../levi-crates, so both repos sit side by side under the workspace
      - uses: actions/checkout@v7
        with:
          path: levi-freecam

      - uses: actions/checkout@v7
        with:
          repository: alaydriem/levi-crates
          path: levi-crates

      - uses: jdx/mise-action@v2
        with:
          working_directory: levi-freecam

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            levi-freecam/target
          key: cargo-${{ hashFiles('levi-freecam/Cargo.lock', 'levi-freecam/rust-toolchain.toml', 'levi-crates/Cargo.lock') }}
          restore-keys: |
            cargo-

      - run: mise run check
      - run: mise run test
      - run: mise run header-check

  changes:
    runs-on: ubuntu-latest
    outputs:
      mod: ${{ steps.filter.outputs.mod }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mod:
              - 'shim/**'
              - 'freecam/ffi/**'
              - 'freecam/ui/**'
              - 'freecam/core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  mod:
    needs: [rust, changes]
    if: needs.changes.outputs.mod == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: levi-freecam
    steps:
      # the path dependencies name ../levi-crates, so both repos sit side by side under the workspace
      - uses: actions/checkout@v7
        with:
          path: levi-freecam

      - uses: actions/checkout@v7
        with:
          repository: alaydriem/levi-crates
          path: levi-crates

      - uses: jdx/mise-action@v2
        with:
          working_directory: levi-freecam

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('levi-freecam/shim/xmake.lua') }}
          restore-keys: |
            xmake-

      # build-mod runs build-ffi and header at the same time; on a fresh runner both would install the
      # toolchain from rust-toolchain.toml at once, and the two rustup downloads race
      - run: rustup toolchain install --no-self-update

      - run: mise run build-mod

      - uses: actions/upload-artifact@v7
        with:
          name: alaydriem-freecam-${{ github.sha }}-client-windows-x64
          path: levi-freecam/shim/bin/alaydriem-freecam/
