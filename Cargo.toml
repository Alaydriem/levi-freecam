[workspace]
resolver = "3"
members = ["freecam/core", "freecam/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tempfile = "3.27.0"
freecam-core = { path = "freecam/core" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
