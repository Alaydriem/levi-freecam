[workspace]
resolver = "3"
members = ["freecam/core", "freecam/ffi", "freecam/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
crossbeam-queue = "0.3.14"
thiserror = "2.0.21"
tempfile = "3.27.0"
stats_alloc = "0.1.10"
egui = "=0.37.0"
amm-abi = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
amm-client = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
amm-core = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
studio-ui = { git = "https://github.com/alaydriem/levi-crates", branch = "master" }
curia = "=0.2.2"
hcl-rs = "=0.19.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
freecam-core = { path = "freecam/core" }
freecam-ui = { path = "freecam/ui" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
