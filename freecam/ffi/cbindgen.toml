language = "C"
cpp_compat = true
include_guard = "LEVI_FREECAM_H"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from freecam/ffi. Do not edit: run `mise run header`. */"
documentation = true
style = "both"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = [
    "FcStatus",
    "FcFrameStatus",
    "FcFrameOutput",
    "FcMarkerEntry",
    "FcRayRequest",
    "FcUiEvent",
    "FcUiFrameInput",
    "FcUiVertex",
    "FcUiDraw",
    "FcUiTextureDelta",
    "FcUiFrame",
]
