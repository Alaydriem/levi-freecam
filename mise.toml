[tasks.preflight]
description = "Names a missing Rust toolchain or cargo-nextest before a build turns it into an obscure error"
dir = "{{config_root}}"
run = [
  "rustc --version",
  "cargo --version",
  "cargo nextest --version",
]

[tasks.check]
description = "cargo check, clippy with warnings denied, and rustfmt check over the workspace"
dir = "{{config_root}}"
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.test]
description = "Every workspace test through cargo-nextest"
dir = "{{config_root}}"
run = "cargo nextest run --workspace"

[tasks.bench-ui]
description = "Runs the headless UI bench (600 frames, fixed snapshot) and prints the views pass and tessellate times"
dir = "{{config_root}}"
run = "cargo run --release -p freecam-ui --example ui_bench"

# Translation catalog: freecam/ui/i18n holds freecam.pot (written from FreecamMessage), the translators' <locale>.po
# files, and packs/<locale>.json.

[tasks."i18n:extract"]
description = "Writes freecam/ui/i18n/freecam.pot from FreecamMessage"
dir = "{{config_root}}"
run = "cargo run -q -p freecam-ui --example freecam_i18n_extract"

[tasks."i18n:check"]
description = "Fails when freecam/ui/i18n/freecam.pot is out of date with FreecamMessage"
dir = "{{config_root}}"
run = "cargo run -q -p freecam-ui --example freecam_i18n_extract -- --check"

[tasks."i18n:pseudo"]
description = "Writes the en_XA pseudo-locale pack of freecam.pot into freecam/ui/i18n/packs/en_XA.json"
dir = "{{config_root}}"
run = "cargo run -q --manifest-path ../levi-crates/Cargo.toml -p levi-i18n-tool -- pseudo freecam/ui/i18n/freecam.pot freecam/ui/i18n/packs/en_XA.json"

[tasks.header]
description = "Regenerates shim/include/levi_freecam.h from the freecam-ffi crate"
dir = "{{config_root}}"
run = "cbindgen --config freecam/ffi/cbindgen.toml --crate freecam-ffi --output shim/include/levi_freecam.h freecam/ffi"

[tasks.header-check]
description = "Fails when shim/include/levi_freecam.h is out of date with the freecam-ffi crate"
dir = "{{config_root}}"
run = "cbindgen --verify --config freecam/ffi/cbindgen.toml --crate freecam-ffi --output shim/include/levi_freecam.h freecam/ffi"

[tasks.build-ffi]
description = "Builds the freecam_ffi static library in release mode"
dir = "{{config_root}}"
run = "cargo build --release -p freecam-ffi"

[tasks.build-mod]
description = "Builds the LeviLamina mod into shim/bin/alaydriem-freecam"
depends = ["build-ffi", "header"]
dir = "{{config_root}}/shim"
# -r: levibuildscript 0.6.2 deletes its prelink library after each link but skips the prelink when only
# freecam_ffi.lib changed, so an incremental relink fails with LNK1181 bedrock_runtime_api.lib
run = ["xmake f -p windows -a x64 -m release -y", "xmake -r -y"]

[tasks.install-mod]
description = "Copies the built mod into the game mods folder named by LM_MODS_DIR (set it in mise.local.toml)"
depends = ["build-mod"]
dir = "{{config_root}}"
shell = "bash -c"
# LeviLamina finds a mod's folder from the manifest name, so the folder carries that name
run = 'mkdir -p "${LM_MODS_DIR:?set LM_MODS_DIR in mise.local.toml}/alaydriem-freecam" && cp -r shim/bin/alaydriem-freecam/. "$LM_MODS_DIR/alaydriem-freecam/"'

[tools]
"cargo:cbindgen" = "0.29.2"
"github:xmake-io/xmake" = "3.1.1"
